server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_user_db}
    username: ${DB_USERNAME:lmsadmin}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 15
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  internal:
    secret:  ${INTERNAL_SECRET}
    enforce: ${INTERNAL_ENFORCE:true}
    max-age-seconds: ${INTERNAL_MAX_AGE_SEC:60}
