server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:5173}
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:

        # ── Public health probes — one route per service ─────────────────────
        - id: health-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/_health/auth
        - id: health-user
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/_health/user
        - id: health-course
          uri: ${COURSE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/_health/course
        - id: health-exam
          uri: ${EXAM_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/_health/exam
        - id: health-attendance
          uri: ${ATTENDANCE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/_health/attendance
        - id: health-finance
          uri: ${FINANCE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/_health/finance
        - id: health-hr
          uri: ${HR_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/_health/hr
        - id: health-notification
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/_health/notification
        - id: health-academics
          uri: ${ACADEMICS_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/_health/academics
        - id: health-feedback
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/_health/feedback
        - id: health-research
          uri: ${RESEARCH_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/_health/research
        - id: health-services
          uri: ${STUDENT_SERVICES_URL:http://localhost:8092}
          predicates:
            - Path=/api/_health/studentservices

        # ── PUBLIC auth endpoints — no JWT required, rate-limited per IP ─────
        - id: auth-public
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/login,/api/auth/register,/api/auth/refresh
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        # ── AUTHENTICATED auth endpoints — JWT required (me/profile/logout/…)
        - id: auth-private
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/students/**,/api/employees/**,/api/departments/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"

        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/courses/**,/api/assignments/**,/api/quizzes/**,/api/announcements/**,/api/enrollments/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"

        - id: examination-service
          uri: ${EXAM_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/examination/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: attendance-service
          uri: ${ATTENDANCE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/attendance/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"

        - id: finance-service
          uri: ${FINANCE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/finance/**
          filters:
            - JwtAuthFilter
            # Stricter limits on money endpoints
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"

        - id: hr-service
          uri: ${HR_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/leaves/**,/api/payroll/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"

        - id: academics-service
          uri: ${ACADEMICS_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/academics/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: feedback-service
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/feedback/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: research-service
          uri: ${RESEARCH_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/research/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: student-services
          uri: ${STUDENT_SERVICES_URL:http://localhost:8092}
          predicates:
            - Path=/api/services/**
          filters:
            - JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

app:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.lms.gateway: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.lms.gateway: INFO
