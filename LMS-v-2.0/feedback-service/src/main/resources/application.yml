server:
  port: 8090

spring:
  application:
    name: feedback-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_feedback_db}
    username: ${DB_USERNAME:lmsadmin}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
