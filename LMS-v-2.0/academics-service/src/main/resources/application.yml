server:
  port: 8089

spring:
  application:
    name: academics-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_academics_db}
    username: ${DB_USERNAME:lmsadmin}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}
  course-service:
    url: ${COURSE_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
