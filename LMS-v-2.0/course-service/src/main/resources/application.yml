server:
  port: 8083

spring:
  application:
    name: course-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_course_db}
    username: ${DB_USERNAME:lmsadmin}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

cloud:
  aws:
    sqs:
      endpoint: ${SQS_ENDPOINT:}
    region:
      static: ${AWS_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  internal:
    secret:  ${INTERNAL_SECRET}
    enforce: ${INTERNAL_ENFORCE:true}
    max-age-seconds: ${INTERNAL_MAX_AGE_SEC:60}
