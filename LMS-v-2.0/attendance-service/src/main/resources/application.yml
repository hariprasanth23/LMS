server:
  port: 8085

spring:
  application:
    name: attendance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_attendance_db}
    username: ${DB_USERNAME:lmsadmin}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

services:
  course-service:
    url: ${COURSE_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
