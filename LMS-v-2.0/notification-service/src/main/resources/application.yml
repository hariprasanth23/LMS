server:
  port: 8088

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_notification_db}
    username: ${DB_USERNAME:lmsadmin}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

cloud:
  aws:
    sqs:
      endpoint: ${SQS_ENDPOINT:}
    region:
      static: ${AWS_REGION:us-east-1}

# SQS queues this service consumes
app:
  sqs:
    queues:
      user-registered: ${SQS_USER_REGISTERED_URL:}
      course-enrolled: ${SQS_COURSE_ENROLLED_URL:}
      assignment-graded: ${SQS_ASSIGNMENT_GRADED_URL:}
      payment-done: ${SQS_PAYMENT_DONE_URL:}
      leave-approved: ${SQS_LEAVE_APPROVED_URL:}
      exam-scheduled: ${SQS_EXAM_SCHEDULED_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
