        condition: service_healthy
    networks:
      - lms-net

  notifications:
    build: ./notifications
    container_name: lms-notifications
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INTERNAL_SECRET:  ${INTERNAL_SECRET}
      INTERNAL_ENFORCE: false
      DB_URL: jdbc:postgresql://postgres:5432/lms_notification_db
      DB_USERNAME: ${NOTIFICATION_DB_USER:-lms_notification_user}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-changeme}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SQS_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - lms-net

  academics:
