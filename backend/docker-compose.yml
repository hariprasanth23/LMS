services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    # 12 services × 10-slot Hikari pools = 120 connections; default max_connections=100
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lmsadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lmsadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms-net

  redis:
    image: redis:7.2-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"
    networks:
      - lms-net

  localstack:
    image: localstack/localstack:3.4
    container_name: lms-localstack
    environment:
      SERVICES: sqs,s3,secretsmanager
      DEBUG: 0
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/setup.sh:/etc/localstack/init/ready.d/setup.sh
      - localstack_data:/var/lib/localstack
    networks:
      - lms-net

  # ── Microservices ─────────────────────────────────────────────────────────────

  gateway:
    build: ./gateway
    container_name: lms-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INTERNAL_SECRET:  ${INTERNAL_SECRET}
      INTERNAL_ENFORCE: false
      JWT_SECRET:     ${JWT_SECRET}
      JWT_ISSUER:     ${JWT_ISSUER:-lms-auth}
      JWT_AUDIENCE:   ${JWT_AUDIENCE:-lms-gateway}
      JWT_CLOCK_SKEW: ${JWT_CLOCK_SKEW:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AUTH_SERVICE_URL: http://auth:8081
      USER_SERVICE_URL: http://users:8082
      COURSE_SERVICE_URL: http://courses:8083
      EXAM_SERVICE_URL: http://exams:8084
      ATTENDANCE_SERVICE_URL: http://attendance:8085
      FINANCE_SERVICE_URL: http://finance:8086
      HR_SERVICE_URL: http://hr:8087
      NOTIFICATION_SERVICE_URL: http://notifications:8088
      ACADEMICS_SERVICE_URL: http://academics:8089
      FEEDBACK_SERVICE_URL: http://feedback:8090
      RESEARCH_SERVICE_URL: http://research:8091
      STUDENT_SERVICES_URL: http://student-services:8092
      MONOLITH_URL: ${MONOLITH_URL:-http://no-monolith-configured.invalid}
    depends_on:
      - redis
    networks:
      - lms-net

  auth:
    build: ./auth
    container_name: lms-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INTERNAL_SECRET:  ${INTERNAL_SECRET}
      INTERNAL_ENFORCE: false
      DB_URL: jdbc:postgresql://postgres:5432/lms_auth_db
      DB_USERNAME: ${AUTH_DB_USER:-lms_auth_user}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-changeme}
      JWT_SECRET:      ${JWT_SECRET}
      JWT_ISSUER:      ${JWT_ISSUER:-lms-auth}
      JWT_AUDIENCE:    ${JWT_AUDIENCE:-lms-gateway}
      JWT_CLOCK_SKEW:  ${JWT_CLOCK_SKEW:-30}
      COOKIE_SECURE:   ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      REDIS_HOST:      redis
      REDIS_PORT:      6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lms-net

  users:
    build: ./users
    container_name: lms-users
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INTERNAL_SECRET:  ${INTERNAL_SECRET}
      INTERNAL_ENFORCE: false
      DB_URL: jdbc:postgresql://postgres:5432/lms_user_db
      DB_USERNAME: ${USER_DB_USER:-lms_user_user}
      DB_PASSWORD: ${USER_DB_PASSWORD:-changeme}
      SQS_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms-net

  courses:
    build: ./courses
    container_name: lms-courses
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INTERNAL_SECRET:  ${INTERNAL_SECRET}
      INTERNAL_ENFORCE: false
      DB_URL: jdbc:postgresql://postgres:5432/lms_course_db
      DB_USERNAME: ${COURSE_DB_USER:-lms_course_user}
      DB_PASSWORD: ${COURSE_DB_PASSWORD:-changeme}
      USER_SERVICE_URL: http://users:8082
      SQS_ENDPOINT: http://localstack:4566
