server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      # ── HTTP client: bound connect + response timeouts on every upstream call.
      # A slow downstream that doesn't close its connection used to tie up a
      # gateway reactor thread indefinitely. Now: 3s connect, 10s response;
      # the per-route circuit breaker enforces tighter limits when configured.
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}     # 3s
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:10000}  # 10s
        pool:
          max-connections: 500
          max-idle-time: 30s
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:5173}
            allowedMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        # Body-size limit — 1 MiB by default. A 50 MB POST to /finance/wallet/add
        # used to chew memory before validation fired.
        - name: RequestSize
          args:
            maxSize: ${GATEWAY_MAX_BODY_BYTES:1048576}
      routes:

        # ── Public health probes — one route per service ─────────────────────
        - id: health-auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/_health/auth
        - id: health-user
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/_health/user
        - id: health-course
          uri: ${COURSE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/_health/course
        - id: health-exam
          uri: ${EXAM_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/_health/exam
        - id: health-attendance
          uri: ${ATTENDANCE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/_health/attendance
        - id: health-finance
          uri: ${FINANCE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/_health/finance
        - id: health-hr
          uri: ${HR_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/_health/hr
        - id: health-notification
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/_health/notification
        - id: health-academics
          uri: ${ACADEMICS_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/_health/academics
        - id: health-feedback
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/_health/feedback
        - id: health-research
          uri: ${RESEARCH_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/_health/research
        - id: health-services
          uri: ${STUDENT_SERVICES_URL:http://localhost:8092}
          predicates:
            - Path=/api/_health/studentservices

        # ── PUBLIC auth endpoints — no JWT required, rate-limited per IP ─────
        - id: auth-public
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/login,/api/auth/register,/api/auth/refresh
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        # ── AUTHENTICATED auth endpoints — JWT required (me/profile/logout/…)
        - id: auth-private
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbAuth
                fallbackUri: forward:/api/_fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/students/**,/api/employees/**,/api/departments/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/user
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"

        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/courses/**,/api/assignments/**,/api/quizzes/**,/api/announcements/**,/api/enrollments/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/course
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"

        - id: examination-service
          uri: ${EXAM_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/examination/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/exam
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: attendance-service
          uri: ${ATTENDANCE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/attendance/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/attendance
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"

        - id: finance-service
          uri: ${FINANCE_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/finance/**
          filters:
            - JwtAuthFilter
            # Stricter breaker on money endpoints — fail FAST on flaky downstream
            - name: CircuitBreaker
              args:
                name: cbFinance
                fallbackUri: forward:/api/_fallback/finance
            # Stricter rate limit on money endpoints
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@userKeyResolver}"

        - id: hr-service
          uri: ${HR_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/leaves/**,/api/payroll/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/hr
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/notification
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@userKeyResolver}"

        - id: academics-service
          uri: ${ACADEMICS_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/academics/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/academics
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: feedback-service
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/feedback/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/feedback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: research-service
          uri: ${RESEARCH_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/research/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/research
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: student-services
          uri: ${STUDENT_SERVICES_URL:http://localhost:8092}
          predicates:
            - Path=/api/services/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/services
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        # ── Strangler-fig fallback to the v1 monolith ───────────────────────
        # Any /api/** path that isn't claimed by a more-specific v2 route above
        # falls through to the legacy monolith. As services migrate, their
        # routes appear above and silently take precedence (Spring Cloud
        # Gateway picks the first matching route, evaluated top-down).
        #
        # Disabled by default — set MONOLITH_URL to enable. In production the
        # ALB target group for the gateway needs egress to MONOLITH_URL.
        - id: monolith-fallback
          uri: ${MONOLITH_URL:http://no-monolith-configured.invalid}
          predicates:
            - Path=/api/**
          filters:
            - JwtAuthFilter
            - name: CircuitBreaker
              args:
                name: cbDefault
                fallbackUri: forward:/api/_fallback/monolith

app:
  internal:
    secret:  ${INTERNAL_SECRET}
    enforce: ${INTERNAL_ENFORCE:true}
    max-age-seconds: ${INTERNAL_MAX_AGE_SEC:60}
  jwt:
    secret: ${JWT_SECRET}
    issuer:   ${JWT_ISSUER:lms-auth-service}
    audience: ${JWT_AUDIENCE:lms-gateway}
    clock-skew-seconds: ${JWT_CLOCK_SKEW:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.lms.gateway: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.lms.gateway: INFO
