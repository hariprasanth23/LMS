# ── Minimal properties for @WebMvcTest and unit tests ──────────────────────────
# Activating the "test" profile explicitly ensures @Profile("!test") beans
# (e.g. EnvValidator) are excluded — not relying on @WebMvcTest's component filter.
spring.profiles.active=test

app.jwt.secret=test-secret-key-for-junit-must-be-32-chars-minimum
app.frontend.url=http://localhost:5173

# Silence unrelated boot banners in test output
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.college=INFO
