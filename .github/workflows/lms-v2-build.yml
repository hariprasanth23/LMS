name: LMS v2 — build & test

on:
  push:
    branches: [ "feature/lms_v_2_0", "main" ]
    paths:
      - "LMS-v-2.0/**"
      - ".github/workflows/lms-v2-build.yml"
  pull_request:
    branches: [ "feature/lms_v_2_0", "main" ]
    paths:
      - "LMS-v-2.0/**"

defaults:
  run:
    working-directory: LMS-v-2.0

concurrency:
  group: lms-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - course-service
          - academics-service
          - attendance-service
          - examination-service
          - finance-service
          - hr-service
          - feedback-service
          - notification-service
          - research-service
          - student-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ${{ matrix.service }}/gradlew

      - name: Build (skip tests)
        working-directory: LMS-v-2.0/${{ matrix.service }}
        run: ./gradlew build -x test --no-daemon --stacktrace

      - name: Test
        working-directory: LMS-v-2.0/${{ matrix.service }}
        env:
          JWT_SECRET:      ci-test-jwt-secret-at-least-32-characters-long
          INTERNAL_SECRET: ci-test-internal-hmac-secret-at-least-32-chars
        run: ./gradlew test --no-daemon --stacktrace
        continue-on-error: true   # most services have no tests yet — don't block CI

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: LMS-v-2.0/${{ matrix.service }}/build/reports/

  compose-validate:
    name: docker-compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: LMS-v-2.0
        env:
          JWT_SECRET:        ci-test-jwt-secret-at-least-32-characters-long
          INTERNAL_SECRET:   ci-test-internal-hmac-secret-at-least-32-chars
          POSTGRES_USER:     lmsadmin
          POSTGRES_PASSWORD: changeme
          FRONTEND_URL:      http://localhost:5173
        run: |
          docker compose config > /dev/null
          echo "✓ docker-compose.yml is valid"
