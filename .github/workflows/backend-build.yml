name: backend — build & test

on:
  push:
    branches: [ "feature/lms_v_2_0", "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
  pull_request:
    branches: [ "feature/lms_v_2_0", "main" ]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - course-service
          - academics-service
          - attendance-service
          - examination-service
          - finance-service
          - hr-service
          - feedback-service
          - notification-service
          - research-service
          - student-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ${{ matrix.service }}/gradlew

      - name: Build (skip tests)
        working-directory: backend/${{ matrix.service }}
        run: ./gradlew build -x test --no-daemon --stacktrace

      - name: Test
        working-directory: backend/${{ matrix.service }}
        env:
          JWT_SECRET:      ci-test-jwt-secret-at-least-32-characters-long
          INTERNAL_SECRET: ci-test-internal-hmac-secret-at-least-32-chars
        # Real services: tests must pass. Others: still scaffolds, no tests yet.
        run: |
          if [ -d src/test/java ]; then
            ./gradlew test --no-daemon --stacktrace
          else
            echo "No tests in ${{ matrix.service }} yet — skipping"
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: backend/${{ matrix.service }}/build/reports/

  docker-build:
    name: docker build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - course-service
          - academics-service
          - attendance-service
          - examination-service
          - finance-service
          - hr-service
          - feedback-service
          - notification-service
          - research-service
          - student-services
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          push: false
          tags: lms/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

  compose-validate:
    name: docker-compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: backend
        env:
          JWT_SECRET:        ci-test-jwt-secret-at-least-32-characters-long
          INTERNAL_SECRET:   ci-test-internal-hmac-secret-at-least-32-chars
          POSTGRES_USER:     lmsadmin
          POSTGRES_PASSWORD: changeme
          FRONTEND_URL:      http://localhost:5173
        run: |
          docker compose config > /dev/null
          echo "✓ docker-compose.yml is valid"
