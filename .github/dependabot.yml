version: 2
updates:
  # ── GitHub Actions in this repo ─────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels: [ "deps", "ci" ]

  # ── v2 services — one entry per gradle project ─────────────────────────────
  - package-ecosystem: gradle
    directory: /backend/api-gateway
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/auth-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/user-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/course-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/examination-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/attendance-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/finance-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2", "finance" ]
  - package-ecosystem: gradle
    directory: /backend/hr-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/notification-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/academics-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/feedback-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/research-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/student-services
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]

  # ── v1 monolith ────────────────────────────────────────────────────────────
  - package-ecosystem: gradle
    directory: /monolith
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [ "deps", "v1" ]

  # ── Frontend (Vite / React) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [ "deps", "frontend" ]
    ignore:
      - dependency-name: "react"        # major bumps: human review
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
