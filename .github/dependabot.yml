version: 2
updates:
  # ── GitHub Actions in this repo ─────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels: [ "deps", "ci" ]

  # ── v2 services — one entry per gradle project ─────────────────────────────
  - package-ecosystem: gradle
    directory: /backend/gateway
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/auth
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/users
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/courses
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/exams
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/attendance
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/finance
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2", "finance" ]
  - package-ecosystem: gradle
    directory: /backend/hr
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/notifications
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/academics
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/feedback
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/research
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]
  - package-ecosystem: gradle
    directory: /backend/student-services
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    labels: [ "deps", "v2" ]

  # (The v1 /monolith Gradle entry was removed when the monolith was
  # deleted — the strangler-fig migration is complete.)

  # ── Frontend (Vite / React) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [ "deps", "frontend" ]
    ignore:
      - dependency-name: "react"        # major bumps: human review
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # ── Mobile (Expo / React Native) ───────────────────────────────────────────
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [ "deps", "mobile" ]
    ignore:
      # Expo/RN version alignment is delicate — skip majors on the core stack.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
